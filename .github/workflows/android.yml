name: Build MCX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          mkdir source
          unzip -q MCX_GRID_AI_ANDROID_V5_PHONE_BUILD.zip -d source

      - name: Build APK
        run: |
          cd source/MCX_GRID_AI_ANDROID_V5
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MCX-ANDROID-APK
          path: source/MCX_GRID_AI_ANDROID_V5/app/build/outputs/apk/debug/app-debug.apk
